type: object
properties:
  nodeSelector:
    type: object
    additionalProperties:
      type: string
    description: |
      The same as in the Pods' `spec.nodeSelector` parameter in Kubernetes.
      If the parameter is omitted or `false`, `nodeSelector` will be determined [automatically](https://deckhouse.io/documentation/v1/#advanced-scheduling).
  dataNodes:
    type: object
    default: {}
    description: |
      Settings that select Kubernetes Nodes eligible to host sds-elastic data.

      sds-elastic places the `storage.deckhouse.io/sds-elastic-node=""` label
      on every Node that matches `dataNodes.nodeSelector`, and removes the
      label from Nodes that no longer match. Downstream components
      (sds-node-configurator agent, ElasticCluster placement) consume this
      label as a node-affinity term.
    properties:
      nodeSelector:
        type: object
        default: {}
        additionalProperties:
          type: string
        description: |
          Same shape as Pods' `spec.nodeSelector`: a map of node labels that
          must all match for a Node to be considered a data node.

          If the parameter is omitted, the empty selector matches every Node
          in the cluster.

          **Caution!** Changing this parameter does not redistribute data.
          If a Node hosting data no longer matches the selector, its
          `storage.deckhouse.io/sds-elastic-node` label is removed and the
          data on that Node becomes unreachable until the Node is brought
          back under the selector.
  tolerations:
    type: array
    description: |
      The same as in the Pods' `spec.tolerations` parameter in Kubernetes;
      If the parameter is omitted or `false`, `tolerations` will be determined [automatically](https://deckhouse.io/documentation/v1/#advanced-scheduling).
    items:
      type: object
      properties:
        effect:
          type: string
          description: |
            Taint effect the toleration matches. An empty value matches any effect.
          enum:
            - ""
            - NoSchedule
            - PreferNoSchedule
            - NoExecute
        key:
          type: string
          description: |
            Taint key the toleration applies to. An empty key with `operator: Exists` matches any taint.
        operator:
          type: string
          description: |
            Operator that defines how `key` and `value` are matched.
          enum:
            - Exists
            - Equal
        tolerationSeconds:
          type: integer
          format: int64
          description: |
            Duration in seconds the toleration tolerates the taint after it is added.

            Applies only when `effect` is `NoExecute`. Unset means tolerate forever.
        value:
          type: string
          description: |
            Taint value the toleration matches. Required when `operator` is `Equal`.
  controller:
    type: object
    default: {}
    description: |
      Settings of the sds-elastic-controller (reconciler for ElasticCluster,
      ElasticStorageClass and ElasticClusterCredential CRs).
    properties:
      resourcesManagement:
        description: |
          sds-elastic-controller resources management options. Same shape as
          the Rook operator `resourcesManagement` below.
        default: {}
        x-examples:
          - mode: VPA
            vpa:
              mode: Auto
              cpu: { min: 50m, max: 200m, limitRatio: 1.5 }
              memory: { min: 64Mi, max: 256Mi, limitRatio: 1.5 }
        properties:
          mode:
            type: string
            description: |
              The mode for managing resource requests. Classical `Static` requests/limits or `VPA`.
            enum: [VPA, Static]
            default: VPA
          vpa:
            type: object
            default: {}
            description: |
              Parameters of the VPA mode.
            properties:
              mode:
                type: string
                description: |
                  The VPA usage mode.
                enum: [Initial, Auto]
                default: Auto
              cpu:
                type: object
                default: {}
                description: |
                  CPU-related parameters.
                properties:
                  max:
                    description: |
                      Maximum allowed CPU requests.
                    default: 200m
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  min:
                    description: |
                      Minimum allowed CPU requests.
                    default: 50m
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  limitRatio:
                    type: number
                    description: |
                      Coefficient used to calculate the initial CPU limit from the request.

                      VPA preserves the resulting limits/requests ratio during further resource tuning.
              memory:
                type: object
                default: {}
                description: |
                  Memory-related parameters.
                properties:
                  max:
                    description: |
                      Maximum allowed memory requests.
                    default: 256Mi
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
                  min:
                    description: |
                      Minimum allowed memory requests.
                    default: 64Mi
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
                  limitRatio:
                    type: number
                    description: |
                      Coefficient used to calculate the initial memory limit from the request.

                      VPA preserves the resulting limits/requests ratio during further resource tuning.
          static:
            type: object
            description: |
              Static resource management settings.
            properties:
              requests:
                type: object
                description: |
                  Resource requests for the controller pod.
                properties:
                  cpu:
                    description: |
                      CPU request.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  memory:
                    description: |
                      Memory request.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
              limits:
                type: object
                description: |
                  Resource limits for the controller pod.
                properties:
                  cpu:
                    description: |
                      CPU limit.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  memory:
                    description: |
                      Memory limit.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
  resourcesManagement:
    description: |
      Rook Ceph Operator resources management options.
    default: {}
    x-examples:
      - mode: VPA
        vpa:
          mode: Auto
          cpu:
            min: 50m
            max: 250m
            limitRatio: 1.5
          memory:
            min: 256Mi
            max: 512Mi
            limitRatio: 1.5
      - mode: Static
        static:
          requests:
            cpu: 55m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
    properties:
      mode:
        type: string
        description: >
          The mode for managing resource requests. Classical `Static`
          requests/limit or `VPA`.
        enum:
          - VPA
          - Static
        default: VPA
      vpa:
        type: object
        default: {}
        description: |
          Parameters of the VPA mode.
        properties:
          mode:
            type: string
            description: |
              The VPA usage mode.
            enum:
              - Initial
              - Auto
            default: Auto
          cpu:
            type: object
            default: {}
            description: |
              CPU-related parameters.
            properties:
              max:
                description: |
                  Maximum allowed CPU requests.
                default: 250m
                oneOf:
                  - type: string
                    pattern: '^[0-9]+m?$'
                  - type: number
              min:
                description: |
                  Minimum allowed CPU requests.
                default: 50m
                oneOf:
                  - type: string
                    pattern: '^[0-9]+m?$'
                  - type: number
              limitRatio:
                type: number
                examples:
                  - 1.5
                description: >
                  The coefficient to calculate cpu limits. It is optionally used
                  to calculate initial limits for Pod. VPA for its part keeps
                  the initial limits/requests ratio during further resource
                  tunings.
          memory:
            type: object
            default: {}
            description: |
              The amount of memory requested.
            properties:
              max:
                description: |
                  Maximum allowed memory requests.
                default: 512Mi
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
              min:
                description: |
                  Minimum allowed memory requests.
                default: 256Mi
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
              limitRatio:
                type: number
                examples:
                  - 1.5
                description: >
                  The coefficient to calculate memory limits. It is optionally
                  used to calculate initial limits for Pod. VPA for its part
                  keeps the initial limits/requests ratio during further
                  resource tunings.
      static:
        type: object
        description: |
          Static resource management settings.
        properties:
          requests:
            type: object
            description: |
              Requests configuration.
            properties:
              cpu:
                oneOf:
                  - type: string
                    pattern: '^[0-9]+m?$'
                  - type: number
                description: |
                  CPU requests.
              memory:
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
                description: |
                  Memory requests.
          limits:
            type: object
            description: |
              Limits configuration.
            properties:
              cpu:
                oneOf:
                  - type: string
                    pattern: '^[0-9]+m?$'
                  - type: number
                description: |
                  CPU limits.
              memory:
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
                description: |
                  Memory limits.
