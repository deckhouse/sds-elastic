{{- $rook_version := include "get_oss_version_by_id" (list "rook" .) }}
{{- /* Base the operator's final image on our own Ceph 20 (tentacle) build
       instead of the upstream CentOS Stream 9 rook/ceph image. The v20 ceph
       werf image name is derived from oss.yaml (cephVersions), so bumping the
       pinned v20 patch in oss.yaml keeps this reference valid without editing
       here. rook/ceph is only the ceph image plus the rook binary, which we
       import below — so this reproduces it on our curated, distroless base. */ -}}
{{- $cephBaseImage := "" }}
{{- range $cephVer, $rawVer := index $.cephVersions "ceph" }}
  {{- if hasPrefix "v20" $cephVer }}
    {{- $cephBaseImage = printf "%sceph-%s" $.ModuleNamePrefix ($cephVer | replace "." "-") }}
  {{- end }}
{{- end }}
{{- if not $cephBaseImage }}{{ fail "operator: no ceph v20 (tentacle) variant found in oss.yaml cephVersions" }}{{- end }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false

git:
  - add: {{ .ModuleDir }}
    to: /src
    includePaths:
      - images/{{ $.ImageName }}/patches
    stageDependencies:
      install:
        - 'images/{{ $.ImageName }}/patches/**/*'

secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}

shell:
  install:
    - git clone --branch v{{ $rook_version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/rook/rook.git /src/rook
    - cd /src/rook
    - |
      shopt -s nullglob
      for patchfile in /src/images/{{ $.ImageName }}/patches/*.patch; do
        echo "Applying ${patchfile}"
        git -c user.email=sds-elastic@flant.com -c user.name='sds-elastic build' am "${patchfile}"
      done
    - rm -rf /src/images/{{ $.ImageName }}/patches
    - rm -rf /src/rook/.git

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-binary-artifact
from: {{ index $.Images (eq .SVACE_ENABLED "false" | ternary "builder/golang-alt" "builder/alpine-svace") }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: install

mount:
{{ include "mount points for golang builds" . }}

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}

shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - cd /src/rook
    - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - |
      {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -tags netgo,osusergo -ldflags="-s -w -X github.com/rook/rook/pkg/version.Version=v%s" -o /rook ./cmd/rook` $rook_version)) | nindent 6 }}
    - chmod +x /rook

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: {{ $cephBaseImage }}

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-binary-artifact
    add: /rook
    to: /usr/local/bin/rook
    before: setup

imageSpec:
  config:
    entrypoint: ["/usr/local/bin/rook"]
    cmd: [""]
