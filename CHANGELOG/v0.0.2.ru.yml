Изменения:
  - Добавлены три Custom Resource (`storage.deckhouse.io/v1alpha1`) и контроллер `sds-elastic-controller`, который их реконсайлит. `ElasticCluster` (ec) поднимает Rook `CephCluster` поверх `BlockDevice` CR, отобранных по меткам. `ElasticStorageClass` (esc) описывает один Ceph-пул и соответствующий ему `CephStorageClass` модуля csi-ceph. `ElasticClusterCredential` (ecc) — внутренний cluster-scoped бэкап идентичности Ceph-кластера (FSID, mon-secret, admin-secret), заполняемый из Secret'а `rook-ceph-mon`.
  - Контроллер для каждого подходящего `BlockDevice` создаёт по одной `LVMVolumeGroup` и `LVMLogicalVolume` (управляются модулем sds-node-configurator) и привязывает получившиеся локальные `PersistentVolume` к helm-managed StorageClass'у `sds-elastic-osd`, который служит подкладкой под Rook OSD `storageClassDeviceSets`.
  - 'Поле `ElasticStorageClass.spec.replication` (`AvailabilityWithoutConsistency`, `ConsistencyAndAvailability`, `ErasureCodedCompact`) транслируется в production-настройки пула под каждый backend. Контроллер поддерживает соответствующий `CephClusterConnection` (1:1 с родительским `ElasticCluster`) и `CephStorageClass` (1:1 с ESC) в csi-ceph.'
  - Добавлены validating-вебхуки. `vendor-cr-validation` запрещает прямые правки ресурсов `ceph.rook.io` и `objectbucket.io` в namespace `d8-sds-elastic` вне ServiceAccount'ов контроллера и оператора Rook (пользователь должен управлять кластером через `ElasticCluster` / `ElasticStorageClass`). `elastic-storage-class-validation` обеспечивает резервирование имени `sds-elastic-osd`, неизменяемость `clusterRef` / `type` / `replication` и запрет связки `RBD + ErasureCodedCompact`. `elastic-cluster-credential-validation` обеспечивает неизменяемость FSID после первого заполнения.
  - Добавлены хуки модуля. `010-uninstall` — заготовка под GC через finalizer'ы (B-N1 в backlog). `020-webhook-certs` готовит TLS-материал для validating-вебхуков.
breaking_changes: |-
  Этот релиз заменяет агрегатный API `SdsElasticCluster` тремя CR выше. Операторам, обновляющимся с раннего dev-билда, нужно выполнить ручную миграцию:
  - `storage.deckhouse.io/v1alpha1.SdsElasticCluster` удалён. До апгрейда необходимо удалить все объекты `SdsElasticCluster` — helm-чарт не выполняет миграцию состояния автоматически.
  - Внутренний manual StorageClass `sds-elastic-osd-manual` удалён вместе с его шаблоном; контроллер теперь работает только с helm-managed StorageClass'ом `sds-elastic-osd`. `helm upgrade` удалит старый SC; если он удерживается чужим finalizer'ом — снимите его вручную.
  - Удалены config-value `sdsElastic.osdStorageClassName` и переменная окружения контроллера `OSD_STORAGE_CLASS_NAME`. Имя OSD StorageClass'а больше не настраивается.
