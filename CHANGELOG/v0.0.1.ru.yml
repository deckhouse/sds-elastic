Изменения:
  - Первоначальный релиз модуля
  - Добавлена настройка модуля `settings.dataNodes.nodeSelector`. Контроллер
    проставляет лейбл `storage.deckhouse.io/sds-elastic-node=""` на каждый
    подходящий по селектору узел Kubernetes и снимает лейбл с узлов,
    переставших ему соответствовать. Downstream-компоненты (агент
    sds-node-configurator, размещение ElasticCluster) могут использовать
    этот лейбл как nodeAffinity (правило сродства подов с узлами) для
    выбора data-узлов.
