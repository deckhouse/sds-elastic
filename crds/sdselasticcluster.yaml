apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sdselasticclusters.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: sds-elastic
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    plural: sdselasticclusters
    singular: sdselasticcluster
    kind: SdsElasticCluster
    shortNames:
      - sdsec
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            SdsElasticCluster is the aggregate top-level CR that describes the
            desired state of the Rook Ceph cluster managed by the sds-elastic
            module: storage backing for OSDs, the CephCluster itself, block
            pools, filesystems, object stores and the optional csi-ceph
            integration (CephClusterConnection + CephStorageClass).
          required:
            - spec
          properties:
            spec:
              type: object
              description: |
                Desired state of the Ceph cluster managed by the sds-elastic module.
              required:
                - network
                - storage
              x-kubernetes-validations:
                - rule: 'has(self.storage.lvm) != has(self.storage.devices)'
                  message: "Exactly one of spec.storage.lvm or spec.storage.devices must be set."
              properties:
                cephVersion:
                  type: string
                  description: |
                    Ceph version backed by a module-built image (not quay.io).
                    Mapped into spec.cephVersion.image of the underlying CephCluster.
                  enum:
                    - v19.2.3
                    - v20.2.1
                  default: v19.2.3
                network:
                  type: object
                  description: |
                    Network configuration for Ceph traffic.
                  required:
                    - public
                    - cluster
                  properties:
                    public:
                      type: string
                      minLength: 1
                      description: |
                        CIDR of the public network for client traffic.
                    cluster:
                      type: string
                      minLength: 1
                      description: |
                        CIDR of the cluster network for replication and heartbeat traffic.
                mon:
                  type: object
                  description: |
                    Configuration for `ceph-mon` daemons.
                  default: { count: 3 }
                  properties:
                    count:
                      type: integer
                      minimum: 1
                      default: 3
                      description: |
                        Quorum size for `ceph-mon`; use an odd number for proper quorum.
                mgr:
                  type: object
                  description: |
                    Configuration for `ceph-mgr` daemons.
                  default: { count: 3 }
                  properties:
                    count:
                      type: integer
                      minimum: 1
                      default: 3
                      description: |
                        Number of `ceph-mgr` replicas.
                storage:
                  type: object
                  description: |
                    OSD backing storage configuration. Exactly one of `lvm` or `devices` must be set.
                  properties:
                    lvm:
                      type: object
                      description: |
                        OSD backing on LVMLogicalVolume and local PVs managed by the sds-node-configurator module.
                      required:
                        - lvgNamePrefix
                        - actualLVName
                        - actualVGName
                        - lvSize
                        - nodeNamePrefix
                        - nodeCount
                      properties:
                        lvgNamePrefix:
                          type: string
                          minLength: 1
                          description: |
                            Prefix of the LVMVolumeGroup names. Per-node groups are matched as `<lvgNamePrefix>-<i>`.
                        actualLVName:
                          type: string
                          minLength: 1
                          description: |
                            Name of the logical volume to be created in each volume group.
                        actualVGName:
                          type: string
                          minLength: 1
                          description: |
                            Name of the volume group on the node; forms the path `/dev/<actualVGName>/<actualLVName>` for the local PV.
                        lvSize:
                          x-kubernetes-int-or-string: true
                          pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                          description: |
                            Size of each per-node logical volume (for example, `100Gi`).
                        nodeNamePrefix:
                          type: string
                          minLength: 1
                          description: |
                            Hostname prefix; nodes are matched as `<nodeNamePrefix>-<i>` against the `kubernetes.io/hostname` label.
                        nodeCount:
                          type: integer
                          minimum: 1
                          description: |
                            Number of nodes and OSDs for which LVMLogicalVolumes and local PVs are created.
                    devices:
                      type: object
                      description: |
                        OSD backing on raw block devices of the node.
                      properties:
                        useAllNodes:
                          type: boolean
                          default: true
                          description: |
                            Use every cluster node. Ignored if `nodes` is set;
                            an explicit list always forces `useAllNodes=false`
                            in the underlying Rook CephCluster spec.
                        useAllDevices:
                          type: boolean
                          default: false
                          description: |
                            Use all eligible devices on the node, ignoring `deviceFilter`.
                        deviceFilter:
                          type: string
                          description: |
                            Regular expression matching device names to be consumed by OSDs (for example, `^vd[b-f]`).
                        nodes:
                          type: array
                          description: |
                            Optional explicit list of storage nodes. When set,
                            the controller emits `spec.storage.useAllNodes=false`
                            and `spec.storage.nodes[]` on Rook with the per-node
                            entries below. `name` must match the Kubernetes
                            Node `.metadata.name` (and the
                            `kubernetes.io/hostname` label).
                          items:
                            type: object
                            required:
                              - name
                            properties:
                              name:
                                type: string
                                minLength: 1
                                description: |
                                  Node name matching `.metadata.name` and the `kubernetes.io/hostname` label.
                              useAllDevices:
                                type: boolean
                                description: |
                                  Overrides `useAllDevices` for this specific node.
                              deviceFilter:
                                type: string
                                description: |
                                  Overrides `deviceFilter` for this specific node.
                blockPools:
                  type: array
                  description: |
                    List of CephBlockPool resources to create in the cluster.
                    Each pool must specify exactly one of `replicated` or `erasureCoded`.
                  items:
                    type: object
                    required:
                      - name
                    x-kubernetes-validations:
                      - rule: 'has(self.replicated) != has(self.erasureCoded)'
                        message: "Exactly one of replicated or erasureCoded must be set."
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: |
                          Name of the CephBlockPool.
                          
                          Used as a suffix in the generated CephStorageClass name `sds-elastic-rbd-<name>`.
                      failureDomain:
                        type: string
                        default: host
                        description: |
                          CRUSH failure domain across which replicas or chunks are distributed
                          (`host`, `rack`, `room`, `datacenter`, etc.).
                      replicated:
                        type: object
                        description: |
                          Replicated pool configuration. Mutually exclusive with `erasureCoded`.
                        required:
                          - size
                        properties:
                          size:
                            type: integer
                            minimum: 1
                            description: |
                              Replication factor.
                              
                              The recommended value for production is `3`.
                          requireSafeReplicaSize:
                            type: boolean
                            description: |
                              If `true`, pool creation fails when `size` is less than 2,
                              preventing single-replica configurations.
                      erasureCoded:
                        type: object
                        description: |
                          Erasure-coded pool configuration.
                          
                          Mutually exclusive with `replicated`.
                        required:
                          - dataChunks
                          - codingChunks
                        properties:
                          dataChunks:
                            type: integer
                            minimum: 1
                            description: |
                              Number of data chunks (`K`) in the erasure code.
                          codingChunks:
                            type: integer
                            minimum: 1
                            description: |
                              Number of coding chunks (`M`) tolerable to OSD failures in the erasure code.
                filesystems:
                  type: array
                  description: |
                    List of CephFilesystem resources to create in the cluster.
                  items:
                    type: object
                    required:
                      - name
                      - metadataPool
                      - dataPools
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: |
                          Name of the CephFilesystem. Used as a suffix in the generated CephStorageClass name `sds-elastic-cephfs-<name>`.
                      preserveFilesystemOnDelete:
                        type: boolean
                        default: true
                        description: |
                          If `true`, the CephFilesystem and its pools are preserved when
                          the filesystem entry is removed from SdsElasticCluster.

                          Used to prevent accidental data loss during reconfiguration.
                      metadataPool:
                        type: object
                        description: |
                          Backing pool for filesystem metadata. Must specify exactly one of `replicated` or `erasureCoded`.
                        properties:
                          failureDomain:
                            type: string
                            default: host
                            description: |
                              CRUSH failure domain across which metadata replicas or chunks are distributed.
                          replicated:
                            type: object
                            description: |
                              Replicated configuration for the metadata pool.
                              
                              Mutually exclusive with `erasureCoded`.
                            required: [size]
                            properties:
                              size:
                                type: integer
                                minimum: 1
                                description: |
                                  Replication factor for the metadata pool.
                              requireSafeReplicaSize:
                                type: boolean
                                description: |
                                  If `true`, pool creation fails when `size` is less than 2.
                          erasureCoded:
                            type: object
                            description: |
                              Erasure-coded configuration for the metadata pool.
                              
                              Mutually exclusive with `replicated`.
                            required: [dataChunks, codingChunks]
                            properties:
                              dataChunks:
                                type: integer
                                minimum: 1
                                description: |
                                  Number of data chunks (`K`) in the erasure code.
                              codingChunks:
                                type: integer
                                minimum: 1
                                description: |
                                  Number of coding chunks (`M`) tolerable to OSD failures.
                      dataPools:
                        type: array
                        minItems: 1
                        description: |
                          One or more backing pools for filesystem data.

                          Multiple data pools allow tiered storage layouts within a single filesystem.
                        items:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              minLength: 1
                              description: |
                                Name of the data pool, unique within the filesystem.
                            failureDomain:
                              type: string
                              default: host
                              description: |
                                CRUSH failure domain across which data replicas or chunks are distributed.
                            replicated:
                              type: object
                              description: |
                                Replicated configuration for the data pool.
                                
                                Mutually exclusive with `erasureCoded`.
                              required: [size]
                              properties:
                                size:
                                  type: integer
                                  minimum: 1
                                  description: |
                                    Replication factor for the data pool.
                                requireSafeReplicaSize:
                                  type: boolean
                                  description: |
                                    If `true`, pool creation fails when `size` is less than 2.
                            erasureCoded:
                              type: object
                              description: |
                                Erasure-coded configuration for the data pool.
                                
                                Mutually exclusive with `replicated`.
                              required: [dataChunks, codingChunks]
                              properties:
                                dataChunks:
                                  type: integer
                                  minimum: 1
                                  description: |
                                    Number of data chunks (`K`) in the erasure code.
                                codingChunks:
                                  type: integer
                                  minimum: 1
                                  description: |
                                    Number of coding chunks (`M`) tolerable to OSD failures.
                      metadataServer:
                        type: object
                        description: |
                          Metadata Server (MDS) deployment configuration for the filesystem.
                        properties:
                          activeCount:
                            type: integer
                            minimum: 1
                            default: 1
                            description: |
                              Number of active MDS daemons that simultaneously serve client requests.
                          activeStandby:
                            type: boolean
                            default: true
                            description: |
                              If `true`, an additional standby MDS is started for each active MDS to provide faster failover.
                objectStores:
                  type: array
                  description: |
                    List of CephObjectStore (RGW) resources to create in the cluster.
                  items:
                    type: object
                    required:
                      - name
                      - metadataPool
                      - dataPool
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: |
                          Name of the CephObjectStore.
                      preservePoolsOnDelete:
                        type: boolean
                        default: true
                        description: |
                          If `true`, the underlying metadata and data pools are preserved when
                          the object store entry is removed from SdsElasticCluster.

                          Used to prevent accidental data loss during reconfiguration.
                      metadataPool:
                        type: object
                        description: |
                          Backing pool for RGW metadata (bucket index, user info, etc.).
                        properties:
                          failureDomain:
                            type: string
                            default: host
                            description: |
                              CRUSH failure domain across which metadata replicas or chunks are distributed.
                          replicated:
                            type: object
                            description: |
                              Replicated configuration for the metadata pool.
                              
                              Mutually exclusive with `erasureCoded`.
                            required: [size]
                            properties:
                              size:
                                type: integer
                                minimum: 1
                                description: |
                                  Replication factor for the metadata pool.
                              requireSafeReplicaSize:
                                type: boolean
                                description: |
                                  If `true`, pool creation fails when `size` is less than 2.
                          erasureCoded:
                            type: object
                            description: |
                              Erasure-coded configuration for the metadata pool.
                              
                              Mutually exclusive with `replicated`.
                            required: [dataChunks, codingChunks]
                            properties:
                              dataChunks:
                                type: integer
                                minimum: 1
                                description: |
                                  Number of data chunks (`K`) in the erasure code.
                              codingChunks:
                                type: integer
                                minimum: 1
                                description: |
                                  Number of coding chunks (`M`) tolerable to OSD failures.
                      dataPool:
                        type: object
                        description: |
                          Backing pool for RGW object data.
                        properties:
                          failureDomain:
                            type: string
                            default: host
                            description: |
                              CRUSH failure domain across which data replicas or chunks are distributed.
                          replicated:
                            type: object
                            description: |
                              Replicated configuration for the data pool.
                              
                              Mutually exclusive with `erasureCoded`.
                            required: [size]
                            properties:
                              size:
                                type: integer
                                minimum: 1
                                description: |
                                  Replication factor for the data pool.
                              requireSafeReplicaSize:
                                type: boolean
                                description: |
                                  If `true`, pool creation fails when `size` is less than 2.
                          erasureCoded:
                            type: object
                            description: |
                              Erasure-coded configuration for the data pool.
                              
                              Mutually exclusive with `replicated`.
                            required: [dataChunks, codingChunks]
                            properties:
                              dataChunks:
                                type: integer
                                minimum: 1
                                description: |
                                  Number of data chunks (`K`) in the erasure code.
                              codingChunks:
                                type: integer
                                minimum: 1
                                description: |
                                  Number of coding chunks (`M`) tolerable to OSD failures.
                      gateway:
                        type: object
                        description: |
                          RGW gateway deployment configuration.
                        properties:
                          port:
                            type: integer
                            default: 80
                            description: |
                              Plain HTTP port exposed by the RGW gateway.
                          securePort:
                            type: integer
                            description: |
                              HTTPS port exposed by the RGW gateway.

                              When unset, TLS is disabled.
                          instances:
                            type: integer
                            minimum: 1
                            default: 1
                            description: |
                              Number of RGW gateway replicas.
                csiCephIntegration:
                  type: object
                  description: |
                    Automatic provisioning of csi-ceph resources (`CephClusterConnection` and
                    `CephStorageClass` for each pool and filesystem). The controller reads
                    monitors, FSID, and userKey from Rook secrets automatically.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: |
                        Enable integration with the csi-ceph module.
                    connectionName:
                      type: string
                      minLength: 1
                      default: ceph-cluster-connection
                      description: |
                        Name of the CephClusterConnection resource to create.
                    userID:
                      type: string
                      description: |
                        Ceph user name written to `spec.userID`. Defaults to the value from the
                        `rook-ceph-mon` secret (typically `admin`).
                placement:
                  type: object
                  description: |
                    Per-daemon placement directives for Ceph pods. Each entry
                    maps 1:1 to Rook's `spec.placement.<role>` and accepts the
                    standard `nodeAffinity`, `podAffinity`, `podAntiAffinity`,
                    `tolerations` and `topologySpreadConstraints` fields, using
                    the same shape as the Kubernetes PodSpec. The `all` entry
                    is applied to every Ceph daemon; role-specific entries
                    (mon, mgr, osd, mds, rgw, cleanup, arbiter) extend or
                    override it.
                  properties:
                    all:
                      type: object
                      description: |
                        Placement applied to every Ceph daemon.
                      x-kubernetes-preserve-unknown-fields: true
                    mon:
                      type: object
                      description: |
                        Placement for `ceph-mon` pods.
                      x-kubernetes-preserve-unknown-fields: true
                    mgr:
                      type: object
                      description: |
                        Placement for `ceph-mgr` pods.
                      x-kubernetes-preserve-unknown-fields: true
                    osd:
                      type: object
                      description: |
                        Placement for OSD pods (including `osd-prepare`).
                      x-kubernetes-preserve-unknown-fields: true
                    mds:
                      type: object
                      description: |
                        Placement for MDS pods (CephFS).
                      x-kubernetes-preserve-unknown-fields: true
                    rgw:
                      type: object
                      description: |
                        Placement for RGW pods (object store).
                      x-kubernetes-preserve-unknown-fields: true
                    cleanup:
                      type: object
                      description: |
                        Placement for cleanup job pods.
                      x-kubernetes-preserve-unknown-fields: true
                    arbiter:
                      type: object
                      description: |
                        Placement for the arbiter daemon in stretch clusters with two zones.
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: |
                Current state of resources managed by SdsElasticCluster.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    The last value of `metadata.generation` processed by the controller.
                phase:
                  type: string
                  description: |
                    Aggregate phase: `Pending`, `InProgress`, `Ready`, or `Error`.
                  enum:
                    - Pending
                    - InProgress
                    - Ready
                    - Error
                clusterID:
                  type: string
                  description: |
                    FSID of the deployed Ceph cluster.
                conditions:
                  type: array
                  description: |
                    Per-component conditions: StorageReady, CephClusterReady, PoolsReady,
                    FilesystemsReady, ObjectStoresReady, CsiCephReady, and the aggregate Ready.
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                        description: |
                          Condition type, for example `Ready`, `StorageReady`, or `CephClusterReady`.
                      status:
                        type: string
                        description: |
                          Current status of the condition.
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        format: int64
                        description: |
                          Value of `metadata.generation` the condition was last set against.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: |
                          Timestamp of the last status transition for this condition.
                      reason:
                        type: string
                        description: |
                          Machine-readable reason for the current status, suitable for log filtering.
                      message:
                        type: string
                        description: |
                          Human-readable explanation of the current status.
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].reason
          name: Reason
          type: string
          priority: 1
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
