spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает один Ceph-пул и соответствующий Kubernetes StorageClass
            (создаётся через модуль csi-ceph). Контроллер транслирует `spec.replication`
            в production-проверенный layout пула и создаёт `CephStorageClass` в csi-ceph
            с тем же именем (1:1).

            Режим репликации `ErasureCodedCompact` временно отключён и недоступен для выбора.
          properties:
            spec:
              properties:
                clusterRef:
                  description: |
                    Имя ElasticCluster, к которому относится этот storage class.
                    Кластер должен существовать и быть в фазе `Ready` до создания пула.
                type:
                  description: |
                    Тип нижележащего Ceph-пула / Kubernetes StorageClass.

                    - `RBD` — блочные тома через Rados Block Device.
                    - `CephFS` — общие тома через subvolume CephFS.
                replication:
                  description: |
                    Высокоуровневая стратегия репликации. Контроллер транслирует значение
                    в настройки пула:

                    - `AvailabilityWithoutConsistency` — 2 реплики, `min_size=1`,
                      `requireSafeReplicaSize=false`. Максимальная доступность ценой риска
                      split-brain. Для некритичных нагрузок.
                    - `ConsistencyAndAvailability` (по умолчанию) — 3 реплики, `min_size=2`.
                      Рекомендуется для прода.
                    - `HighRedundancy` — 4 реплики, `min_size=2`,
                      `requireSafeReplicaSize=true`. Переживает одновременный отказ двух
                      хостов с непрерывным I/O и сохраняет ещё одну реплику как запас на
                      восстановление: потеря данных только при четвёртом одновременном
                      отказе. Требует не менее 5 storage-узлов; пока существует хотя бы
                      один HighRedundancy ESC, контроллер автоматически повышает
                      топологию CephCluster до 5 mon и 3 mgr и не возвращает её обратно
                      даже после удаления триггерного ESC. Аудит — в
                      `ElasticCluster.status.cephTopology`.

                    Режим `ErasureCodedCompact` временно отключён и не является
                    допустимым значением.
                pgNum:
                  description: |
                    Необязательное целевое значение `pg_num` для пула. Если
                    задано, прокидывается в `parameters.pg_num` пула Rook. Если
                    не задано, размер PG определяет Ceph. Чтобы количество PG
                    оставалось фиксированным, дополнительно установите
                    `pgAutoscaleMode: off` — иначе автоскейлер может переопределить
                    значение. Рекомендуются степени двойки.

                    Применяется к RBD-пулу и data-пулу CephFS; metadata-пул CephFS
                    сохраняет значения Ceph по умолчанию.
                pgAutoscaleMode:
                  description: |
                    Необязательный `pg_autoscale_mode` пула. Установите `off`,
                    чтобы автоскейлер PG не перемещал данные между OSD, — это
                    нужный режим для тестовых / вложенных кластеров, которые не
                    должны ребалансироваться. Комбинируйте с `pgNum`, чтобы
                    зафиксировать количество PG. Если не задано, пул наследует
                    значение кластера по умолчанию (`on`; mgr-модуль
                    pg_autoscaler включён на уровне кластера).

                    Применяется к RBD-пулу и data-пулу CephFS; metadata-пул CephFS
                    сохраняет значения Ceph по умолчанию.
            status:
              description: |
                Текущее состояние ресурсов, управляемых ElasticStorageClass.
              properties:
                observedGeneration:
                  description: |
                    Последнее значение `metadata.generation`, обработанное контроллером.
                phase:
                  description: |
                    Агрегатная фаза: `Pending`, `InProgress`, `Ready`, `Error`.
                conditions:
                  description: |
                    Покомпонентные condition: `PoolReady`, `CsiStorageClassReady` и
                    агрегатное `Ready`.
                  items:
                    properties:
                      type:
                        description: Тип condition.
                      status:
                        description: Текущий статус condition.
                      observedGeneration:
                        description: Значение `metadata.generation`, для которого выставлен condition.
                      lastTransitionTime:
                        description: Время последнего перехода condition.
                      reason:
                        description: Машинно-читаемая причина текущего статуса.
                      message:
                        description: Человекочитаемое описание текущего статуса.
