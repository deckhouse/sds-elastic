apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticclustercredentials.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: sds-elastic
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    plural: elasticclustercredentials
    singular: elasticclustercredential
    kind: ElasticClusterCredential
    shortNames:
      - ecc
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            ElasticClusterCredential stores a backup of the cluster identity
            (FSID, mon-secret, admin-secret) outside the module namespace so that
            the cluster can be recovered after `kubectl delete ns d8-sds-elastic`.

            This is an internal resource managed exclusively by the sds-elastic
            controller; it is not intended for direct user access. Its lifecycle
            is bound to the parent ElasticCluster via ownerReferences (cascade
            delete on EC removal).

            In the current version only the BACK-SYNC direction is implemented:
            the controller populates `spec` from the `rook-ceph-mon` Secret. The
            reverse RESTORE flow (re-creating the Secret from `spec` on namespace
            re-create) will be added in a subsequent release.
          required:
            - spec
          x-kubernetes-validations:
            - rule: "size(self.metadata.name) <= 30"
              message: "ElasticClusterCredential metadata.name must not exceed 30 characters (it must be 1:1 with ElasticCluster.metadata.name)."
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')"
              message: "ElasticClusterCredential metadata.name must be a valid DNS-1123 label."
          properties:
            spec:
              type: object
              description: |
                Spec is intentionally not `required: [fsid, monSecret, adminSecret]`:
                the controller back-syncs fields incrementally and the resource
                exists in a transient empty state between Get-or-Create and the
                first successful read of the `rook-ceph-mon` Secret. The
                validating webhook (Layer 3) currently enforces only FSID
                immutability after first population; a "fully populated on
                Phase=Populated" invariant is tracked as backlog item B-N5
                and is not yet enforced.
              x-kubernetes-validations:
                - rule: "oldSelf == null || !has(oldSelf.fsid) || self.fsid == oldSelf.fsid"
                  message: "spec.fsid is immutable after it has been populated by the controller."
              properties:
                fsid:
                  type: string
                  description: |
                    Ceph cluster FSID/UUID, copied from `data.fsid` of the
                    `rook-ceph-mon` Secret. Immutable after first population.
                  minLength: 1
                monSecret:
                  type: string
                  description: |
                    Mon secret, copied from `data.mon-secret` of the
                    `rook-ceph-mon` Secret. Required for mon recovery in a future
                    release.
                  minLength: 1
                adminSecret:
                  type: string
                  description: |
                    Admin secret, copied from `data.admin-secret` of the
                    `rook-ceph-mon` Secret. Used by csi-ceph as the userKey for
                    the CephClusterConnection in the current release.
                  minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum:
                    - Pending
                    - Populated
                    - Error
                lastSyncTime:
                  type: string
                  format: date-time
                  description: |
                    Timestamp of the last successful BACK-SYNC from the
                    `rook-ceph-mon` Secret.
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.lastSyncTime
          name: LastSync
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
