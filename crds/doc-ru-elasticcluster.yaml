spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает желаемое состояние Ceph-кластера, разворачиваемого модулем sds-elastic.
            Контроллер поднимает Rook CephCluster (mon/mgr/osd) поверх локального LVM-хранилища,
            обнаруженного через `blockDeviceSelector`.

            Конфигурация пулов (RBD/CephFS, стратегия репликации) описывается отдельно — в
            ресурсах `ElasticStorageClass`, ссылающихся на этот `ElasticCluster` по имени.
          properties:
            spec:
              description: |
                Желаемое состояние Ceph-кластера под управлением модуля sds-elastic.
              properties:
                storage:
                  description: |
                    Конфигурация хранилища под OSD. Контроллер выбирает подходящие BlockDevice
                    на подходящих узлах и для каждого устройства создаёт по одной LVMVolumeGroup,
                    одной LVMLogicalVolume и одному локальному PersistentVolume, который
                    становится бэкендом одного OSD.
                  properties:
                    nodeSelector:
                      description: |
                        Селектор узлов Kubernetes, рассматриваемых как storage-узлы.
                        Каждый матчащийся узел запускает mon/mgr/mds (по необходимости) и OSD
                        для каждого подходящего BlockDevice.
                      properties:
                        matchLabels:
                          description: Карта label-селекторов.
                        matchExpressions:
                          description: Список выражений label-селектора.
                          items:
                            properties:
                              key:
                                description: Имя ключа метки.
                              operator:
                                description: Оператор сравнения.
                              values:
                                description: Список значений.
                    blockDeviceSelector:
                      description: |
                        Селектор ресурсов BlockDevice (управляемых модулем sds-node-configurator),
                        пригодных для размещения OSD. Выбранные устройства должны находиться на
                        узлах, подпадающих под `storage.nodeSelector`, и быть свободными
                        (consumable).
                      properties:
                        matchLabels:
                          description: Карта label-селекторов.
                        matchExpressions:
                          description: Список выражений label-селектора.
                          items:
                            properties:
                              key:
                                description: Имя ключа метки.
                              operator:
                                description: Оператор сравнения.
                              values:
                                description: Список значений.
                network:
                  description: |
                    Опциональная конфигурация сети. Если не задана — Rook слушает на всех
                    host-IP storage-узлов (host networking). При указании оба поля
                    (`public` и `cluster`) должны задаваться одновременно. Поля иммутабельны.
                  properties:
                    public:
                      description: |
                        CIDR публичной подсети для трафика клиентов (например, `10.0.0.0/24`).
                    cluster:
                      description: |
                        CIDR кластерной подсети для репликации и heartbeat-трафика (например, `10.0.1.0/24`).
            status:
              description: |
                Текущее состояние ресурсов, управляемых ElasticCluster.
              properties:
                observedGeneration:
                  description: |
                    Последнее значение `metadata.generation`, обработанное контроллером.
                phase:
                  description: |
                    Агрегатная фаза: `Pending`, `InProgress`, `Ready`, `Error`.
                cephFSID:
                  description: |
                    FSID/UUID развёрнутого Ceph-кластера, считывается из секрета `rook-ceph-mon`
                    после старта Rook.
                monEndpoints:
                  description: |
                    Список эндпойнтов `ceph-mon` в формате `<host>:<port>`, разобранный
                    из ConfigMap `rook-ceph-mon-endpoints`.
                monMaxId:
                  description: |
                    Наибольший id mon, достигнутый на текущий момент. Зарезервирован под
                    flow disaster recovery.
                credentialsRef:
                  description: |
                    Ссылка на ресурс `ElasticClusterCredentials`, в котором хранится бэкап
                    идентичности кластера (FSID, секреты mon/admin) за пределами namespace
                    модуля. Заполняется 1:1 с `metadata.name`.
                  properties:
                    name:
                      description: Имя ECC-ресурса.
                cephVersion:
                  description: |
                    Состояние версии Ceph. Желаемая версия зашита в образ модуля; bump модуля
                    запускает rolling-upgrade в Rook.
                  properties:
                    requested:
                      description: Версия, запрошенная контроллером (соответствует образу модуля).
                    running:
                      description: |
                        Версия, фактически работающая в кластере; берётся из
                        `CephCluster.status.cephStatus.ceph.versions`.
                    upgradeProgress:
                      description: Прогресс по этапам идущего rolling-upgrade.
                      properties:
                        phase:
                          description: Текущий этап обновления.
                        completed:
                          description: Сколько демонов на этом этапе уже на запрошенной версии.
                        total:
                          description: Всего демонов в этапе.
                        lastTransitionTime:
                          description: Время последнего перехода фазы.
                conditions:
                  description: |
                    Покомпонентные condition: `StorageReady`, `CephClusterReady`, `CredentialsReady`,
                    `CsiCephReady`, `UpgradeReady`, `UpgradeInProgress` и агрегатное `Ready`.
                  items:
                    properties:
                      type:
                        description: Тип condition.
                      status:
                        description: Текущий статус condition.
                      observedGeneration:
                        description: Значение `metadata.generation`, для которого condition был выставлен.
                      lastTransitionTime:
                        description: Время последнего перехода condition.
                      reason:
                        description: Машинно-читаемая причина текущего статуса.
                      message:
                        description: Человекочитаемое описание текущего статуса.
