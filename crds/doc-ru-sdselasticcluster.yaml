spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает желаемое состояние кластера Rook Ceph, разворачиваемого модулем sds-elastic: хранилище
            под OSD, сам CephCluster, блочные пулы, файловые системы, объектные хранилища и (опционально) интеграция с csi-ceph
            (CephClusterConnection + CephStorageClass).
          properties:
            spec:
              description: |
                Желаемое состояние кластера Ceph под управлением модуля sds-elastic.
              properties:
                cephVersion:
                  description: |
                    Версия Ceph из образов, собранных модулем (v19.2.3 или v20.2.1).
                    Подставляется в `spec.cephVersion.image` ресурса CephCluster.
                network:
                  description: |
                    Подсети для трафика Ceph.
                  properties:
                    public:
                      description: |
                        CIDR публичной подсети для трафика клиентов Ceph.
                    cluster:
                      description: |
                        CIDR кластерной подсети для репликации и heartbeat-трафика Ceph.
                mon:
                  description: |
                    Параметры демонов `ceph-mon`.
                  properties:
                    count:
                      description: |
                        Размер кворума `ceph-mon`. Используйте нечётное число для корректного кворума.
                mgr:
                  description: |
                    Параметры демонов `ceph-mgr`.
                  properties:
                    count:
                      description: |
                        Количество реплик `ceph-mgr`.
                storage:
                  description: |
                    Выбор бэкенд-хранилища OSD: либо `lvm` (LLV + локальные PV
                    через sds-node-configurator), либо `devices` (сырые блочные
                    устройства на узле). Должен быть задан ровно один из
                    вариантов.
                  properties:
                    lvm:
                      description: |
                        Бэкенд-хранилище OSD на базе LVMLogicalVolume и локальных PV.
                      properties:
                        lvgNamePrefix:
                          description: |
                            Префикс имён LVMVolumeGroup. На каждом узле будет
                            создан LLV в группе `<lvgNamePrefix>-<i>`.
                        actualLVName:
                          description: |
                            Имя фактического LV, создаваемого в каждой VG.
                        actualVGName:
                          description: |
                            Имя фактической VG на узле; формирует путь
                            `/dev/<actualVGName>/<actualLVName>` для локального PV.
                        lvSize:
                          description: |
                            Размер LV, создаваемого на каждом узле (например, `100Gi`).
                        nodeNamePrefix:
                          description: |
                            Префикс hostname; каждый узел сопоставляется как
                            `<nodeNamePrefix>-<i>` через лейбл `kubernetes.io/hostname`.
                        nodeCount:
                          description: |
                            Количество узлов/OSD, для которых создаются LLV и PV.
                    devices:
                      description: |
                        Бэкенд-хранилище OSD на сырых блочных устройствах узла.
                      properties:
                        useAllNodes:
                          description: |
                            Использовать все узлы кластера для размещения OSD.
                            Игнорируется, если задан список `nodes`: явный
                            список всегда подразумевает `useAllNodes=false`
                            в спецификации Rook.
                        useAllDevices:
                          description: |
                            Использовать все подходящие устройства на узле
                            (игнорирует `deviceFilter`).
                        deviceFilter:
                          description: |
                            Регулярное выражение для имён устройств (например,
                            `^vd[b-f]`).
                        nodes:
                          description: |
                            Явный список узлов, на которых разворачиваются OSD.
                            При задании контроллер выставляет
                            `useAllNodes=false` и формирует
                            `spec.storage.nodes[]` в CephCluster. `name`
                            должен совпадать с `.metadata.name` узла (и
                            значением лейбла `kubernetes.io/hostname`).
                          items:
                            properties:
                              name:
                                description: |
                                  Имя узла (`kubernetes.io/hostname`).
                              useAllDevices:
                                description: |
                                  Переопределяет `useAllDevices` для этого узла.
                              deviceFilter:
                                description: |
                                  Переопределяет `deviceFilter` для этого узла.
                blockPools:
                  description: |
                    Список CephBlockPool, создаваемых в кластере. Для каждого
                    пула указывается либо `replicated`, либо `erasureCoded`.
                  items:
                    properties:
                      name:
                        description: |
                          Имя CephBlockPool.
                          
                          Используется как суффикс в имени создаваемого CephStorageClass `sds-elastic-rbd-<name>`.
                      failureDomain:
                        description: |
                          Домен отказа CRUSH, по которому распределяются реплики или чанки пула (`host`, `rack`, `room`, `datacenter` и т. п.).
                      replicated:
                        description: |
                          Конфигурация реплицированного пула.
                          
                          Взаимоисключающе с `erasureCoded`.
                        properties:
                          size:
                            description: |
                              Фактор репликации.
                              
                              Рекомендуемое значение для production — `3`.
                          requireSafeReplicaSize:
                            description: |
                              Если `true`, создание пула завершается ошибкой при `size < 2`, что предотвращает конфигурации с одной репликой.
                      erasureCoded:
                        description: |
                          Конфигурация erasure-coded пула.
                          
                          Взаимоисключающе с `replicated`.
                        properties:
                          dataChunks:
                            description: |
                              Количество чанков данных (`K`) в erasure-кодировании.
                          codingChunks:
                            description: |
                              Количество чанков избыточности (`M`) — допустимое число отказов OSD без потери данных.
                filesystems:
                  description: |
                    Список CephFilesystem, создаваемых в кластере.
                  items:
                    properties:
                      name:
                        description: |
                          Имя CephFilesystem.
                          
                          Используется как суффикс в имени создаваемого CephStorageClass `sds-elastic-cephfs-<name>`.
                      preserveFilesystemOnDelete:
                        description: |
                          Если `true`, CephFilesystem и его пулы сохраняются при удалении записи о файловой системе из SdsElasticCluster.

                          Защищает от случайной потери данных при реконфигурации.
                      metadataPool:
                        description: |
                          Пул для метаданных файловой системы.
                        properties:
                          failureDomain:
                            description: |
                              Домен отказа CRUSH, по которому распределяются реплики или чанки метаданных.
                          replicated:
                            description: |
                              Реплицированная конфигурация пула метаданных.
                              
                              Взаимоисключающе с `erasureCoded`.
                            properties:
                              size:
                                description: |
                                  Фактор репликации пула метаданных.
                              requireSafeReplicaSize:
                                description: |
                                  Если `true`, создание пула завершается ошибкой при `size < 2`.
                          erasureCoded:
                            description: |
                              Erasure-coded конфигурация пула метаданных.
                              
                              Взаимоисключающе с `replicated`.
                            properties:
                              dataChunks:
                                description: |
                                  Количество чанков данных (`K`) в erasure-кодировании.
                              codingChunks:
                                description: |
                                  Количество чанков избыточности (`M`) — допустимое число отказов OSD.
                      dataPools:
                        description: |
                          Один или несколько пулов для данных файловой системы.

                          Несколько data-пулов позволяют реализовать многоуровневое (tiered) хранение в рамках одной файловой системы.
                        items:
                          properties:
                            name:
                              description: |
                                Имя data-пула, уникальное в пределах файловой системы.
                            failureDomain:
                              description: |
                                Домен отказа CRUSH, по которому распределяются реплики или чанки данных.
                            replicated:
                              description: |
                                Реплицированная конфигурация data-пула.
                                
                                Взаимоисключающе с `erasureCoded`.
                              properties:
                                size:
                                  description: |
                                    Фактор репликации data-пула.
                                requireSafeReplicaSize:
                                  description: |
                                    Если `true`, создание пула завершается ошибкой при `size < 2`.
                            erasureCoded:
                              description: |
                                Erasure-coded конфигурация data-пула.
                                
                                Взаимоисключающе с `replicated`.
                              properties:
                                dataChunks:
                                  description: |
                                    Количество чанков данных (`K`) в erasure-кодировании.
                                codingChunks:
                                  description: |
                                    Количество чанков избыточности (`M`) — допустимое число отказов OSD.
                      metadataServer:
                        description: |
                          Конфигурация развёртывания Metadata Server (MDS) для файловой системы.
                        properties:
                          activeCount:
                            description: |
                              Количество активных MDS-демонов, одновременно обслуживающих клиентские запросы.
                          activeStandby:
                            description: |
                              Если `true`, для каждого активного MDS запускается дополнительный standby-демон для ускорения failover.
                objectStores:
                  description: |
                    Список CephObjectStore (RGW), создаваемых в кластере.
                  items:
                    properties:
                      name:
                        description: |
                          Имя CephObjectStore.
                      preservePoolsOnDelete:
                        description: |
                          Если `true`, пулы метаданных и данных сохраняются при удалении записи об объектном хранилище из SdsElasticCluster.

                          Защищает от случайной потери данных при реконфигурации.
                      metadataPool:
                        description: |
                          Пул для метаданных RGW (индексы бакетов, данные пользователей и т. д.).
                        properties:
                          failureDomain:
                            description: |
                              Домен отказа CRUSH, по которому распределяются реплики или чанки метаданных.
                          replicated:
                            description: |
                              Реплицированная конфигурация пула метаданных.
                              
                              Взаимоисключающе с `erasureCoded`.
                            properties:
                              size:
                                description: |
                                  Фактор репликации пула метаданных.
                              requireSafeReplicaSize:
                                description: |
                                  Если `true`, создание пула завершается ошибкой при `size < 2`.
                          erasureCoded:
                            description: |
                              Erasure-coded конфигурация пула метаданных.
                              
                              Взаимоисключающе с `replicated`.
                            properties:
                              dataChunks:
                                description: |
                                  Количество чанков данных (`K`) в erasure-кодировании.
                              codingChunks:
                                description: |
                                  Количество чанков избыточности (`M`) — допустимое число отказов OSD.
                      dataPool:
                        description: |
                          Пул для объектных данных RGW.
                        properties:
                          failureDomain:
                            description: |
                              Домен отказа CRUSH, по которому распределяются реплики или чанки данных.
                          replicated:
                            description: |
                              Реплицированная конфигурация data-пула.
                              
                              Взаимоисключающе с `erasureCoded`.
                            properties:
                              size:
                                description: |
                                  Фактор репликации data-пула.
                              requireSafeReplicaSize:
                                description: |
                                  Если `true`, создание пула завершается ошибкой при `size < 2`.
                          erasureCoded:
                            description: |
                              Erasure-coded конфигурация data-пула.
                              
                              Взаимоисключающе с `replicated`.
                            properties:
                              dataChunks:
                                description: |
                                  Количество чанков данных (`K`) в erasure-кодировании.
                              codingChunks:
                                description: |
                                  Количество чанков избыточности (`M`) — допустимое число отказов OSD.
                      gateway:
                        description: |
                          Параметры развёртывания шлюза RGW.
                        properties:
                          port:
                            description: |
                              HTTP-порт, на котором шлюз RGW принимает соединения.
                          securePort:
                            description: |
                              HTTPS-порт, на котором шлюз RGW принимает соединения.

                              Если не задан, TLS отключён.
                          instances:
                            description: |
                              Количество реплик шлюза RGW.
                csiCephIntegration:
                  description: |
                    Автоматическое создание ресурсов csi-ceph
                    (`CephClusterConnection` + `CephStorageClass` под каждый
                    пул/FS). Контроллер сам прочитает monitors / FSID / userKey
                    из секретов Rook.
                  properties:
                    enabled:
                      description: |
                        Включает интеграцию с csi-ceph.
                    connectionName:
                      description: |
                        Имя ресурса CephClusterConnection.
                    userID:
                      description: |
                        Имя пользователя Ceph для записи в `spec.userID`. По
                        умолчанию подставляется из секрета `rook-ceph-mon`
                        (обычно `admin`).
                placement:
                  description: |
                    Параметры размещения подов Ceph по ролям. Каждая запись
                    отображается 1:1 в `spec.placement.<role>` ресурса
                    CephCluster и принимает стандартные поля PodSpec:
                    `nodeAffinity`, `podAffinity`, `podAntiAffinity`,
                    `tolerations`, `topologySpreadConstraints`. Запись `all`
                    применяется ко всем демонам; ролевые записи
                    (`mon`, `mgr`, `osd`, `mds`, `rgw`, `cleanup`, `arbiter`)
                    дополняют или переопределяют её.
                  properties:
                    all:
                      description: Размещение, применяемое ко всем демонам Ceph.
                    mon:
                      description: Размещение для пода `ceph-mon`.
                    mgr:
                      description: Размещение для пода `ceph-mgr`.
                    osd:
                      description: Размещение для подов OSD (включая `osd-prepare`).
                    mds:
                      description: Размещение для подов MDS (CephFS).
                    rgw:
                      description: Размещение для подов RGW (объектное хранилище).
                    cleanup:
                      description: Размещение для подов `cleanup-job`.
                    arbiter:
                      description: |
                        Размещение для арбитра (stretch-кластеры с двумя зонами).
            status:
              description: |
                Текущее состояние ресурсов, управляемых SdsElasticCluster.
              properties:
                observedGeneration:
                  description: |
                    Последнее значение `metadata.generation`, обработанное
                    контроллером.
                phase:
                  description: |
                    Обобщённое состояние: `Pending`, `InProgress`, `Ready` или
                    `Error`.
                clusterID:
                  description: |
                    FSID развёрнутого Ceph-кластера.
                conditions:
                  description: |
                    Состояние отдельных стадий: StorageReady, CephClusterReady,
                    PoolsReady, FilesystemsReady, ObjectStoresReady,
                    CsiCephReady, Ready.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия, например `Ready`, `StorageReady`, `CephClusterReady`.
                      status:
                        description: |
                          Текущий статус условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, при котором условие было выставлено.
                      lastTransitionTime:
                        description: |
                          Время последнего перехода статуса этого условия.
                      reason:
                        description: |
                          Машиночитаемая причина текущего статуса; удобна для фильтрации логов.
                      message:
                        description: |
                          Человекочитаемое описание текущего статуса.
