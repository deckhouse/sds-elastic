apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticclustercredentials.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: sds-elastic
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    plural: elasticclustercredentials
    singular: elasticclustercredential
    kind: ElasticClusterCredential
    shortNames:
      - ecc
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            ElasticClusterCredential is an internal cluster-scoped CR that backs up
            the Ceph cluster identity (FSID, mon-secret, admin-secret) outside the
            module namespace. It is managed exclusively by the sds-elastic
            controller and its lifecycle is bound to the parent ElasticCluster via
            ownerReferences (cascade delete on EC removal).

            In the current release only the BACK-SYNC direction is implemented:
            the controller populates `spec` from the `rook-ceph-mon` Secret in
            `d8-sds-elastic`. The reverse RESTORE flow (re-creating the Secret
            from `spec` on namespace re-create) will be added in a subsequent
            release.

            FSID immutability after first population is enforced by the validating
            webhook, not by CRD-level CEL — the controller back-syncs fields
            incrementally and the resource exists in a transient empty state
            between Get-or-Create and the first successful read of the
            `rook-ceph-mon` Secret.
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')"
              message: "ElasticClusterCredential metadata.name must be a valid DNS-1123 label."
          properties:
            spec:
              type: object
              description: |
                Mirrored Ceph identity material. The fields are populated by the
                controller from the `rook-ceph-mon` Secret in `d8-sds-elastic`;
                operators must not edit them by hand.
              properties:
                fsid:
                  type: string
                  description: |
                    Ceph cluster FSID/UUID, copied from `data.fsid` of the
                    `rook-ceph-mon` Secret. Immutable after first population
                    (enforced by the validating webhook).
                monSecret:
                  type: string
                  description: |
                    Copied from `data.mon-secret` of the `rook-ceph-mon` Secret.
                adminSecret:
                  type: string
                  description: |
                    Copied from `data.admin-secret` of the `rook-ceph-mon`
                    Secret. Used by csi-ceph as the `userKey` for the
                    `CephClusterConnection` in the current release.
            status:
              type: object
              description: |
                Current state of the BACK-SYNC reconciliation.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    The last value of `metadata.generation` processed by the controller.
                phase:
                  type: string
                  description: |
                    Coarse-grained summary of the BACK-SYNC progress:
                    `Pending` — created, no successful sync yet;
                    `Populated` — `spec.fsid` / `monSecret` / `adminSecret` are
                    all set from the `rook-ceph-mon` Secret;
                    `Error` — the last sync attempt failed (see controller logs).
                  enum:
                    - Pending
                    - Populated
                    - Error
                lastSyncTime:
                  type: string
                  format: date-time
                  description: |
                    Timestamp of the last successful BACK-SYNC from the
                    `rook-ceph-mon` Secret.
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.fsid
          name: FSID
          type: string
          priority: 1
        - jsonPath: .status.lastSyncTime
          name: LastSync
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
