spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Внутренний cluster-scoped CR, в который контроллер sds-elastic
            бэкапит идентичность Ceph-кластера (FSID, mon-secret, admin-secret)
            вне namespace модуля. Жизненный цикл привязан к родительскому
            `ElasticCluster` через ownerReferences (каскадное удаление при
            удалении EC).

            В текущем релизе реализовано только направление BACK-SYNC:
            контроллер копирует поля `spec` из Secret'а `rook-ceph-mon` в
            namespace `d8-sds-elastic`. Обратный поток RESTORE (восстановление
            Secret'а из `spec` при пересоздании namespace) появится в следующем
            релизе.

            Неизменяемость `fsid` после первого заполнения обеспечивается
            validating-вебхуком, а не CEL-правилом CRD: контроллер заполняет
            поля поэтапно, и ресурс некоторое время существует с пустым `spec`
            между Get-or-Create и первым успешным чтением Secret'а.
          properties:
            spec:
              description: |
                Зеркало идентичности Ceph-кластера. Поля заполняются контроллером
                из Secret'а `rook-ceph-mon` в namespace `d8-sds-elastic`;
                редактировать вручную нельзя.
              properties:
                fsid:
                  description: |
                    FSID/UUID Ceph-кластера, скопированный из `data.fsid`
                    Secret'а `rook-ceph-mon`. Неизменяем после первого
                    заполнения (контролируется validating-вебхуком).
                monSecret:
                  description: |
                    Скопировано из `data.mon-secret` Secret'а `rook-ceph-mon`.
                adminSecret:
                  description: |
                    Скопировано из `data.admin-secret` Secret'а `rook-ceph-mon`.
                    Используется модулем csi-ceph как `userKey` для
                    `CephClusterConnection` в текущем релизе.
            status:
              description: |
                Текущее состояние BACK-SYNC-реконсиляции.
              properties:
                observedGeneration:
                  description: |
                    Последнее значение `metadata.generation`, обработанное контроллером.
                phase:
                  description: |
                    Сводное состояние BACK-SYNC:
                    `Pending` — ресурс создан, успешной синхронизации ещё не было;
                    `Populated` — `spec.fsid` / `monSecret` / `adminSecret`
                    заполнены из Secret'а `rook-ceph-mon`;
                    `Error` — последняя попытка синхронизации завершилась ошибкой
                    (см. логи контроллера).
                lastSyncTime:
                  description: |
                    Время последней успешной синхронизации из Secret'а
                    `rook-ceph-mon`.
