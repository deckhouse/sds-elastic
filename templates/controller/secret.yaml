{{- /*
  Controller-config Secret consumed by the data-node-watcher reconciler in
  sds-elastic-controller. The reconciler watches this Secret (filtered by
  name) and reapplies the `storage.deckhouse.io/sds-elastic-node=""` label
  on Nodes that match `.Values.sdsElastic.dataNodes.nodeSelector`,
  removing it from Nodes that no longer match.

  Keeping the user-facing selector out of the controller Deployment env
  block lets the operator change `dataNodes.nodeSelector` without
  restarting the controller pod: the change propagates through the Secret
  watch on the next reconcile.
*/ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: d8-{{ .Chart.Name }}-controller-config
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
type: Opaque
stringData:
  config: |-
    nodeSelector: {{ .Values.sdsElastic.dataNodes.nodeSelector | toYaml | nindent 6 }}
