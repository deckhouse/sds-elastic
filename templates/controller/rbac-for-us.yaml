{{- /*
  RBAC for the sds-elastic-controller.

  The controller-runtime cache is cluster-scoped by default, so any
  namespaced resource that the manager watches (Secret, ConfigMap,
  Deployment) requires cluster-wide get/list/watch on the ServiceAccount.
  Keep mutation verbs for those resources in the namespaced Role -
  we only ever create/update/delete them in d8-sds-elastic.

  patch/update on nodes is required by the data-node-watcher reconciler
  so it can add/remove `storage.deckhouse.io/sds-elastic-node` on Nodes
  matched by `settings.dataNodes.nodeSelector`. The webhooks share the
  same ServiceAccount but exercise only the read verbs.

  Go templates do not tolerate `{{- /* */ -}}` comments inside the
  argument expression of a function call (here: `(list ...)`), so any
  rule-level commentary must live in this header block rather than
  inline.
*/ -}}
{{- $rbacConfig := dict
  "roleRules" (list
    (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "list" "patch"))
    (dict "apiGroups" (list "") "resources" (list "secrets" "configmaps") "verbs" (list "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "apps") "resources" (list "deployments") "verbs" (list "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
  )
  "clusterRoleRules" (list
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "elasticclusters" "elasticclusters/status" "elasticclusters/finalizers") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "elasticstorageclasses" "elasticstorageclasses/status" "elasticstorageclasses/finalizers") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "elasticclustercredentials" "elasticclustercredentials/status" "elasticclustercredentials/finalizers") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "blockdevices") "verbs" (list "get" "list" "watch" "update" "patch"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "lvmvolumegroups" "lvmlogicalvolumes") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "cephclusterconnections" "cephclusterconnections/status" "cephstorageclasses" "cephstorageclasses/status") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "internal.ceph.rook.io") "resources" (list "cephclusters" "cephblockpools" "cephfilesystems") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "apps") "resources" (list "deployments") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "secrets" "configmaps") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "persistentvolumes") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "") "resources" (list "nodes") "verbs" (list "get" "list" "watch" "patch" "update"))
  )
}}
{{ include "helm_lib_module_controller_rbac" (list . $rbacConfig) }}
