# sds-elastic e2e nested test cluster.
#
# 1 master + 5 storage workers. Five workers are the minimum for the
# HighRedundancy ElasticStorageClass (5-mon quorum, OSDs accepted on >=4
# distinct nodes) and the CephFS ErasureCodedCompact replication (>=4 nodes).
#
# Raw OSD disks are NOT declared here: storage-e2e's cluster config schema has
# no per-node "additional disks" field. Instead the suite attaches raw
# VirtualDisks to every worker VM at runtime in BeforeSuite (via
# storage-e2e AttachVirtualDiskToVM, the same primitive
# CreateDefaultStorageClass uses), then sds-node-configurator surfaces them as
# consumable BlockDevices that the ElasticCluster adopts for OSDs.
#
# Modules enabled here are the minimum the e2e harness needs on top of a
# freshly bootstrapped Deckhouse:
#   - snapshot-controller    : CSI snapshotter, dependency of the storage stack
#   - sds-node-configurator  : scans block devices on each node and publishes
#                              BlockDevice CRs (the OSD disks the EC adopts)
#   - csi-ceph               : the EC controller wires CephClusterConnection /
#                              CephStorageClass (storage.deckhouse.io) through it
#   - sds-elastic            : the module under test; ships the vendored Rook
#                              operator (renamed group
#                              internal.sdselastic.deckhouse.io) and the EC/ESC
#                              controllers. Pinned to the image under test via
#                              modulePullOverride: "${MODULE_IMAGE_TAG}".
#
# sds-local-volume is intentionally absent: sds-elastic OSDs consume raw
# BlockDevices directly, not a LocalStorageClass.
clusterDefinition:
  masters:
    - hostname: "master-1"
      hostType: "vm"
      osType: "Ubuntu 22.04 6.2.0-39-generic"
      cpu: 4
      coreFraction: 50
      ram: 8
      diskSize: 50
  workers:
    - hostname: "worker-1"
      hostType: "vm"
      osType: "Ubuntu 22.04 6.2.0-39-generic"
      cpu: 4
      coreFraction: 50
      ram: 8
      diskSize: 50
    - hostname: "worker-2"
      hostType: "vm"
      osType: "Ubuntu 22.04 6.2.0-39-generic"
      cpu: 4
      coreFraction: 50
      ram: 8
      diskSize: 50
    - hostname: "worker-3"
      hostType: "vm"
      osType: "Ubuntu 22.04 6.2.0-39-generic"
      cpu: 4
      coreFraction: 50
      ram: 8
      diskSize: 50
    - hostname: "worker-4"
      hostType: "vm"
      osType: "Ubuntu 22.04 6.2.0-39-generic"
      cpu: 4
      coreFraction: 50
      ram: 8
      diskSize: 50
    - hostname: "worker-5"
      hostType: "vm"
      osType: "Ubuntu 22.04 6.2.0-39-generic"
      cpu: 4
      coreFraction: 50
      ram: 8
      diskSize: 50
  dkpParameters:
    kubernetesVersion: "Automatic"
    podSubnetCIDR: "10.112.0.0/16"
    serviceSubnetCIDR: "10.225.0.0/16"
    clusterDomain: "cluster.local"
    registryRepo: "dev-registry.deckhouse.io/sys/deckhouse-oss"
    devBranch: "main"
    modules:
      - name: "snapshot-controller"
        version: 1
        enabled: true
        modulePullOverride: "main"
        dependencies: []
      - name: "sds-node-configurator"
        version: 1
        enabled: true
        settings:
          enableThinProvisioning: true
        dependencies: []
      - name: "csi-ceph"
        version: 1
        enabled: true
        modulePullOverride: "main"
        dependencies:
          - "snapshot-controller"
      - name: "sds-elastic"
        version: 1
        enabled: true
        # CI must set MODULE_IMAGE_TAG, e.g. "pr<N>" on GitHub, "mr<N>" on
        # GitLab, or "main" for nightly. storage-e2e expands ${VAR} forms at
        # config load time and fails fast if the env var is unset. The mc
        # disable-guard webhook (commit C3) must be present in this image for
        # the module_disable specs to pass.
        modulePullOverride: "${MODULE_IMAGE_TAG}"
        dependencies:
          - "snapshot-controller"
          - "sds-node-configurator"
          - "csi-ceph"
