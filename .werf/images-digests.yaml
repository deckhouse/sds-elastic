{{- /* Find all images digests and save use them to compose a structure for the module values. */ -}}
{{- $ImagesIDList := list }}
{{- $Images := tpl (.Files.Get ".werf/images.yaml") . }}


{{- range $ImageManifest := regexSplit "\n?---[ \t]*\n" $Images -1 }}
  {{- $ImageManifest := $ImageManifest | fromYaml }}
  {{- /* The *-vex-artifact images produced by the "vex mitigation" template are
         final only so werf pushes them; they carry a cosign attestation for
         another image, not a module component. Keep them out of
         images_digests.json: the module has no values for them, and the CVE
         gate scans every digest listed there — which would report cosign's own
         Go dependencies against this module. */ -}}
  {{- if and $ImageManifest.image (ne ($ImageManifest.final | toJson) "false") (eq $ImageManifest.image (trimSuffix "-vex-artifact" $ImageManifest.image)) }}
    {{- $ImagesIDList = append $ImagesIDList $ImageManifest.image }}
  {{- end }}
{{- end }}

# Images Digest: a files with all image digests to be able to use them in helm templates of a module
---
image: images-digests
from: {{ index $.Images "builder/alpine" }}
import:
  - from: {{ index $.Images "jq" }}
    add: /usr/bin/jq
    to: /usr/bin/jq
    before: setup
dependencies:
{{- range $ImageID := $ImagesIDList }}
  {{- $ImageNameCamel  := $ImageID | splitList "/" | last  | camelcase | untitle }}
  - image: {{ $ImageID }}
    before: setup
    imports:
    - type: ImageDigest
      targetEnv: MODULE_IMAGE_DIGEST_{{ $ImageNameCamel }}
{{- end }}
shell:
  setup:
    - |
      env | grep MODULE_IMAGE_DIGEST | jq -Rn '
        reduce inputs as $i (
          {};
          . * (
            $i | ltrimstr("MODULE_IMAGE_DIGEST_") | sub("=";"_") |
            split("_") as [$imageName, $digest] |
            {($imageName): $digest}
          )
        )
      ' > /images_digests.json
